<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions & Locations Log</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .admin-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .stat-card span {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card strong {
      font-size: 1.75rem;
      color: #ffffff;
      font-family: var(--font-mono);
    }

    .controls-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.85rem;
      flex: 1;
      min-width: 240px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.875rem;
      width: 100%;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-subtle);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .select-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.85rem;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .select-input option {
      background: #111827;
      color: #ffffff;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      overflow-x: auto;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    thead {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--card-border);
    }

    th {
      padding: 1rem 1.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge-source {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
    }

    .source-device {
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .source-ip {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .source-unknown {
      background: rgba(156, 163, 175, 0.15);
      color: #9ca3af;
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    .coords-cell {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .acc-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-muted);
    }

    .btn-maps {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn-maps:hover {
      background: rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>

  <div class="admin-container">
    <!-- Top Header -->
    <header class="top-bar">
      <div>
        <div class="logo-tag">
          <span class="status-dot"></span>
          <span>Database Sessions Log</span>
        </div>
        <h1 style="margin-top: 0.5rem; font-size: 1.85rem;">Captured Locations & Sessions</h1>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <button id="refreshBtn" class="btn btn-primary btn-sm">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
          </svg>
          Refresh Data
        </button>
        <a href="/" class="btn btn-sm" style="background: rgba(255,255,255,0.06); text-decoration: none; color: inherit;">
          &larr; Back to Inspector
        </a>
      </div>
    </header>

    <!-- Stats Summary Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <span>Total Records</span>
        <strong id="statTotal">0</strong>
      </div>
      <div class="stat-card">
        <span>Exact GPS Device</span>
        <strong id="statGPS" style="color: #34d399;">0</strong>
      </div>
      <div class="stat-card">
        <span>IP Geolocation</span>
        <strong id="statIP" style="color: #fbbf24;">0</strong>
      </div>
      <div class="stat-card">
        <span>Unique IPs</span>
        <strong id="statUniqueIPs" style="color: #38bdf8;">0</strong>
      </div>
    </section>

    <!-- Filters & Sorting Controls -->
    <div class="controls-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--text-muted);">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Filter by IP, City, Country, Address, or OS...">
      </div>
      <div class="filter-group">
        <label for="sortSelect" style="font-size: 0.8rem; color: var(--text-muted);">Sort By:</label>
        <select id="sortSelect" class="select-input">
          <option value="date-desc">Date (Newest First)</option>
          <option value="date-asc">Date (Oldest First)</option>
          <option value="source-device">Source (Exact GPS First)</option>
          <option value="country-asc">Country (A-Z)</option>
        </select>

        <label for="sourceFilter" style="font-size: 0.8rem; color: var(--text-muted);">Source:</label>
        <select id="sourceFilter" class="select-input">
          <option value="all">All Sources</option>
          <option value="device">Device (GPS)</option>
          <option value="ip">IP Approximation</option>
        </select>
      </div>
    </div>

    <!-- Sessions Table Card -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Time / Date</th>
            <th>IP Address</th>
            <th>Source</th>
            <th>Coordinates (Lat, Lng)</th>
            <th>Address / City</th>
            <th>Device & OS</th>
            <th>Map</th>
          </tr>
        </thead>
        <tbody id="sessionsTableBody">
          <tr>
            <td colspan="7" class="empty-state">Loading records from MongoDB Atlas...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allSessions = [];

    async function fetchSessions() {
      const tbody = document.getElementById('sessionsTableBody');
      try {
        const res = await fetch('/api/sessions?limit=100');
        if (!res.ok) throw new Error('API request failed');
        const json = await res.json();
        
        allSessions = json.data || [];
        updateStats(allSessions);
        renderTable();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color: #f87171;">Failed to load sessions: ${err.message}</td></tr>`;
      }
    }

    function updateStats(data) {
      document.getElementById('statTotal').textContent = data.length;
      const gpsCount = data.filter(d => d.locationSource === 'device').length;
      const ipCount = data.filter(d => d.locationSource === 'ip').length;
      const uniqueIPs = new Set(data.map(d => d.ip)).size;

      document.getElementById('statGPS').textContent = gpsCount;
      document.getElementById('statIP').textContent = ipCount;
      document.getElementById('statUniqueIPs').textContent = uniqueIPs;
    }

    function renderTable() {
      const tbody = document.getElementById('sessionsTableBody');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortType = document.getElementById('sortSelect').value;
      const sourceFilter = document.getElementById('sourceFilter').value;

      let filtered = allSessions.filter(item => {
        // Source filter
        if (sourceFilter !== 'all' && item.locationSource !== sourceFilter) {
          return false;
        }

        // Search filter
        if (!searchTerm) return true;
        const haystack = [
          item.ip,
          item.city,
          item.country,
          item.address,
          item.os,
          item.browser,
          item.isp
        ].filter(Boolean).join(' ').toLowerCase();

        return haystack.includes(searchTerm);
      });

      // Sorting
      filtered.sort((a, b) => {
        if (sortType === 'date-desc') {
          return new Date(b.createdAt || b.savedAt) - new Date(a.createdAt || a.savedAt);
        } else if (sortType === 'date-asc') {
          return new Date(a.createdAt || a.savedAt) - new Date(b.createdAt || b.savedAt);
        } else if (sortType === 'source-device') {
          if (a.locationSource === 'device' && b.locationSource !== 'device') return -1;
          if (b.locationSource === 'device' && a.locationSource !== 'device') return 1;
          return new Date(b.createdAt || b.savedAt) - new Date(a.createdAt || a.savedAt);
        } else if (sortType === 'country-asc') {
          return (a.country || '').localeCompare(b.country || '');
        }
        return 0;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No matching sessions found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const date = item.createdAt ? new Date(item.createdAt).toLocaleString() : 'N/A';
        const isDevice = item.locationSource === 'device';
        const sourceBadge = `<span class="badge-source ${isDevice ? 'source-device' : (item.locationSource === 'ip' ? 'source-ip' : 'source-unknown')}">${item.locationSource || 'unknown'}</span>`;
        
        const lat = item.latitude != null ? Number(item.latitude).toFixed(5) : '—';
        const lng = item.longitude != null ? Number(item.longitude).toFixed(5) : '—';
        const acc = item.accuracy != null ? `<span class="acc-tag">±${item.accuracy}m</span>` : '';
        const coords = (item.latitude != null && item.longitude != null) 
          ? `<div class="coords-cell"><span>${lat}, ${lng}</span>${acc}</div>` 
          : '—';

        const address = item.address || [item.city, item.country].filter(Boolean).join(', ') || 'N/A';
        const device = [item.os, item.browser].filter(Boolean).join(' / ') || 'N/A';
        const mapsLink = item.mapsUrl 
          ? `<a href="${item.mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-maps">Maps &nearr;</a>`
          : (item.latitude && item.longitude ? `<a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank" rel="noopener noreferrer" class="btn-maps">Maps &nearr;</a>` : '—');

        return `
          <tr>
            <td style="white-space: nowrap; color: var(--text-muted); font-size: 0.8rem;">${date}</td>
            <td style="font-family: var(--font-mono); font-weight: 600;">${item.ip || 'Unknown'}</td>
            <td>${sourceBadge}</td>
            <td>${coords}</td>
            <td style="max-width: 260px; word-break: break-word;">${address}</td>
            <td style="color: var(--text-muted); font-size: 0.82rem;">${device}</td>
            <td>${mapsLink}</td>
          </tr>
        `;
      }).join('');
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', renderTable);
    document.getElementById('sortSelect').addEventListener('change', renderTable);
    document.getElementById('sourceFilter').addEventListener('change', renderTable);
    document.getElementById('refreshBtn').addEventListener('click', fetchSessions);

    // Initial load
    fetchSessions();
  </script>
</body>
</html>
